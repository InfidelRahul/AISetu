name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings" # Fails the build if there are ANY compiler warnings

jobs:
  # JOB 1: Linting & Formatting
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          components: rustfmt, clippy
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Check Formatting
        run: cargo fmt --all -- --check
        
      - name: Run Clippy (Linter)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # JOB 2: Unit & Integration Tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Run Tests
        run: cargo test --workspace --all-targets

  # JOB 3: Build Release Binary (Only runs if lint & test pass)
  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
          
      - uses: Swatinem/rust-cache@v2
      
      - name: Build Release Binary
        run: cargo build --release -p aisetu
        
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aisetu-linux-x86_64
          path: target/release/aisetu
          retention-days: 1

  # JOB 4: Security Audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run Security Audit
        run: cargo audit
