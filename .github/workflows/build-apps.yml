# Build installable apps for Windows, macOS, Linux, and Android.
# Artifacts expire after 7 days and a weekly job deletes leftovers.
name: Build apps

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma list: linux,win,mac,android,all"
        default: "all"

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  ARTIFACT_DAYS: "7"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

jobs:
  cleanup-artifacts:
    name: Delete old artifacts
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete artifacts older than ${{ env.ARTIFACT_DAYS }} days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DAYS="${ARTIFACT_DAYS}"
          CUTOFF=$(date -u -d "${DAYS} days ago" +%s)
          echo "Deleting artifacts older than ${DAYS} days (before $(date -u -d @${CUTOFF} --iso-8601=seconds))"
          PAGE=1
          while :; do
            JSON=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100&page=${PAGE}")
            COUNT=$(echo "$JSON" | jq '.artifacts | length')
            [[ "$COUNT" -eq 0 ]] && break
            echo "$JSON" | jq -c '.artifacts[]' | while read -r row; do
              ID=$(echo "$row" | jq -r '.id')
              NAME=$(echo "$row" | jq -r '.name')
              CREATED=$(echo "$row" | jq -r '.created_at')
              TS=$(date -u -d "$CREATED" +%s)
              if [[ "$TS" -lt "$CUTOFF" ]]; then
                echo "delete ${ID} ${NAME} ${CREATED}"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ID}" >/dev/null
              fi
            done
            PAGE=$((PAGE + 1))
          done
          echo "Cleanup finished"

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm test

  desktop:
    name: Desktop (${{ matrix.label }})
    if: github.event_name != 'schedule'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-latest
            script: linux
          - label: Windows
            os: windows-latest
            script: win
          - label: macOS
            os: macos-latest
            script: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Electron toolchain
        run: npm install --no-save --legacy-peer-deps electron@32.2.0 electron-builder@25.1.8
      - name: Linux extras
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Web UI
        run: npm run build:web
      - name: Portable Node app (Linux)
        if: runner.os == 'Linux'
        run: bash ./build.sh portable
      - name: Electron package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.script }} --config electron-builder.yml --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: aisetu-desktop-${{ matrix.script }}
          path: release/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

  android:
    name: Android APK
    if: github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - run: npm ci --legacy-peer-deps
      - name: EAS production APK (if EXPO_TOKEN is set)
        continue-on-error: true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then echo "No EXPO_TOKEN"; exit 0; fi
          npm install --no-save --legacy-peer-deps eas-cli
          npx eas-cli build --platform android --profile preview --non-interactive --no-wait || true
      - name: Local Gradle APK
        id: gradle
        continue-on-error: true
        run: |
          npx expo prebuild --platform android --non-interactive
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../release/android
          find . -name '*.apk' -exec cp {} ../release/android/ \;
      - name: JS bundle fallback
        if: steps.gradle.outcome != 'success'
        run: |
          mkdir -p release/android
          npx expo export --platform android --output-dir release/android/export || true
          printf '%s\n' "Unsigned local APK was not produced. Install Android Studio and run:" "  npx expo prebuild --platform android" "  cd android && ./gradlew assembleRelease" > release/android/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aisetu-android
          path: release/android/**
          if-no-files-found: warn
          retention-days: 1

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
