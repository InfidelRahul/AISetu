[server]
bind = "127.0.0.1"
port = 8080
# api_key = "set-via-AISETU_API_KEY"

[log]
level = "info"
format = "pretty"

[transport]
timeout_ms = 60000
connect_timeout_ms = 10000
tls_verify = true
allow_insecure_tls = false
max_redirects = 5

[limits]
max_concurrent_requests = 128
max_request_bytes = 2097152
max_response_bytes = 8388608
max_messages = 256
request_timeout_ms = 60000
shutdown_grace_ms = 10000
max_connections = 64

[storage]
data_dir = "./data"
secrets_dir = "./secrets"

[[providers]]
name = "mock"
kind = "mock"
model = "mock-text"
enabled = true

[[providers]]
name = "echo"
kind = "echo"
model = "echo-text"
enabled = true

# Example HTTP provider (disabled until base_url is set)
# [[providers]]
# name = "upstream"
# kind = "http_json"
# base_url = "https://example.invalid/v1/chat"
# model = "upstream-text"
# enabled = false

[[models]]
id = "aisetu-default"
provider = "mock"
upstream_model = "mock-text"

[[models]]
id = "aisetu-echo"
provider = "echo"
upstream_model = "echo-text"

